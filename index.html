<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qorovul Paneli - Xavfsizlik Tizimi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        #video-container {
            position: relative;
            display: inline-block;
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 15px;
        }

        #camera-stream {
            width: 640px;
            height: 480px;
            object-fit: cover;
            background-color: #000;
        }

        #alert-box {
            margin: 20px auto;
            width: 600px;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 6px;
            background-color: #333;
            transition: background-color 0.3s ease;
        }

        /* Begona kirganda qizil signal va miltillash */
        .status-alert {
            background-color: #d32f2f !important;
            animation: blink 0.8s infinite;
        }

        /* Xodim bo'lganda yashil indikator */
        .status-clear {
            background-color: #388e3c !important;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Qorovul Xavfsizlik Paneli</h1>

    <div id="video-container">
        <img id="camera-stream" src="" alt="Kamera oqimi kutilmoqda...">
    </div>

    <div id="alert-box">Serverga ulanmoqda...</div>

    <!-- Signal audio ovozi -->
    <audio id="siren-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws/stream");
        const streamImg = document.getElementById("camera-stream");
        const alertBox = document.getElementById("alert-box");
        const siren = document.getElementById("siren-sound");

        ws.onopen = () => {
            alertBox.innerText = "Tizimga muvaffaqiyatli ulandi. Kamera faol.";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            // Kadrni va matnni yangilash
            streamImg.src = data.image;
            alertBox.innerText = data.message;

            // Signal mantiqiy tekshiruvi
            if (data.status === "ALERT") {
                alertBox.className = "status-alert";
                siren.play().catch(() => {}); // Ovoz chiqarish
            } else if (data.status === "EMPLOYEE") {
                alertBox.className = "status-clear";
                siren.pause();
                siren.currentTime = 0;
            } else {
                alertBox.className = "";
                siren.pause();
                siren.currentTime = 0;
            }
        };

        ws.onclose = () => {
            alertBox.innerText = "Server bilan aloqa uzildi!";
            alertBox.style.backgroundColor = "#555";
        };
    </script>
</body>
</html>
